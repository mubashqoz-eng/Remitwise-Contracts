name: Soroban Smart Contracts CI
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
jobs:
  build:
    name: Workspace manifest check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Validate workspace manifest
      run: cargo metadata --locked --format-version 1 > /dev/null
